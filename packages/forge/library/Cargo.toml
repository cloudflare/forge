# Forge as a library, compiled to a WebAssembly component of the `library`
# world, which `@cloudflare/forge` turns into JavaScript to parse documents
# in the caller's process. scripts/build.mjs builds it with:
#
#     cargo build --release --target wasm32-unknown-unknown -p forge-library
#
# A member of the root workspace, so it shares forge's Cargo.lock and its
# release profile.
[package]
name = "forge-library"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
forge = { path = "../../..", default-features = false, features = ["library"] }
