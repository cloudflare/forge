openapi: 3.0.3
info:
  title: Test API
  version: 1.0.0
paths:
  /uploads/{file_id}:
    post:
      operationId: upload
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileId:
                  type: string
                payload:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
