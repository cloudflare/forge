openapi: 3.1.0
info:
  title: Shapes
  version: 1.0.0
paths:
  /shapes:
    get:
      operationId: listShapes
      parameters:
        - name: shape
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Shape'
      responses:
        '200':
          description: OK
components:
  schemas:
    Shape:
      oneOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Square'
      discriminator:
        propertyName: type
        mapping:
          circle: '#/components/schemas/Circle'
          square: '#/components/schemas/Square'
    Circle:
      type: object
      properties:
        type:
          type: string
        radius:
          type: number
    Square:
      type: object
      properties:
        type:
          type: string
        side:
          type: number
