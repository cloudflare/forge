openapi: 3.1.0
info:
  title: Users
  version: 1.0.0
paths:
  /users/{id}:
    put:
      operationId: replaceUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /users/{userId}:
    put:
      operationId: updateUser
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
