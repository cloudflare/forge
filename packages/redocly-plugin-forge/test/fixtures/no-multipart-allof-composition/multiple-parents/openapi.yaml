openapi: 3.1.0
info:
  title: Multiple parents
  version: 1.0.0
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/BaseOne'
                - $ref: '#/components/schemas/BaseTwo'
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
components:
  schemas:
    BaseOne:
      type: object
      properties:
        one:
          type: string
    BaseTwo:
      type: object
      properties:
        two:
          type: string
