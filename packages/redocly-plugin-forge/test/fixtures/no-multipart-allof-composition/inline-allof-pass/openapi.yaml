openapi: 3.1.0
info:
  title: Inline allOf pass
  version: 1.0.0
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - type: object
                  properties:
                    name:
                      type: string
                - type: object
                  properties:
                    file:
                      type: string
                      format: binary
      responses:
        '200':
          description: OK
