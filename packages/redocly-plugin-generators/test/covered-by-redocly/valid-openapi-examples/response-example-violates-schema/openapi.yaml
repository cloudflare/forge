openapi: 3.1.0
info:
  title: Plants
  version: 1.0.0
paths:
  /plants:
    get:
      operationId: listPlants
      responses:
        '200':
          description: The plants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: [fern, 3]
