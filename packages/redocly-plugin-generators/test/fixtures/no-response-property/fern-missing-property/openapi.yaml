openapi: 3.0.3
info:
  title: Movies
  version: 1.0.0
paths:
  /movies:
    post:
      operationId: getMovie
      x-fern-sdk-return-value: id
      requestBody:
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

  /movies/dotted:
    get:
      operationId: getDotted
      x-fern-sdk-return-value: data.id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'

components:
  schemas:
    Movie:
      type: object
      properties:
        id:
          type: string
    Response:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Movie'
