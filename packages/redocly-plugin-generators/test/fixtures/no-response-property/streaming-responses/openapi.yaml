openapi: 3.0.3
info:
  title: Movies
  version: 1.0.0
paths:
  /a:
    post:
      operationId: jsonStreamExistingProperty
      x-fern-sdk-return-value: data
      x-fern-streaming: true
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Response'
  /b:
    post:
      operationId: jsonStreamMissing
      x-fern-sdk-return-value: chunk
      x-fern-streaming:
        format: json
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /c:
    post:
      operationId: conditionValid
      x-fern-sdk-return-value: id
      x-fern-streaming:
        stream-condition: $request.stream
        response:
          $ref: '#/components/schemas/Movie'
        response-stream:
          $ref: '#/components/schemas/Response'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stream:
                  type: boolean
      responses:
        '200':
          description: OK
  /d:
    post:
      operationId: conditionMissing
      x-fern-sdk-return-value: data
      x-fern-streaming:
        stream-condition: $request.stream
        response:
          $ref: '#/components/schemas/Movie'
        response-stream:
          $ref: '#/components/schemas/Response'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stream:
                  type: boolean
      responses:
        '200':
          description: OK

components:
  schemas:
    Movie:
      type: object
      properties:
        id:
          type: string
    Response:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Movie'
