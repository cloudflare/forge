openapi: 3.0.3
info:
  title: Movies
  version: 1.0.0
paths:
  /a:
    get:
      operationId: arrayResponse
      x-fern-sdk-return-value: data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Response'

  /b:
    get:
      operationId: stringResponse
      x-fern-sdk-return-value: data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /c:
    get:
      operationId: unionResponse
      x-fern-sdk-return-value: data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Response'
                  - $ref: '#/components/schemas/Movie'

  /d:
    get:
      operationId: mapResponse
      x-fern-sdk-return-value: data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/Movie'

  /e:
    get:
      operationId: nullableString
      x-fern-sdk-return-value: data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
                nullable: true

components:
  schemas:
    Movie:
      type: object
      properties:
        id:
          type: string
    Response:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Movie'
