openapi: 3.0.3
info:
  title: Chat
  version: 1.0.0
paths:
  /chat:
    post:
      operationId: stringExtension
      x-fern-streaming: sse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /chat/format:
    post:
      operationId: badFormat
      x-fern-streaming:
        format: ndjson
        terminator: 0
        stream-description:
          text: Streams.
        resumable: 'yes'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /chat/resumable:
    post:
      operationId: resumableJson
      x-fern-streaming:
        format: json
        resumable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /chat/ignored:
    post:
      operationId: ignoredOperation
      x-fern-ignore: true
      x-fern-streaming:
        stream-condition: $request.missing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
