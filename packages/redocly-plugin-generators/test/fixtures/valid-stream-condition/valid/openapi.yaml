openapi: 3.0.3
info:
  title: Chat
  version: 1.0.0
paths:
  /chat:
    post:
      operationId: booleanStreamCondition
      x-fern-streaming:
        stream-condition: $request.stream
        response:
          type: string
        response-stream:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectWithStream'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /chat/optional:
    post:
      operationId: optionalBooleanStreamCondition
      x-fern-streaming:
        format: sse
        stream-condition: stream
        resumable: true
        response:
          type: string
        response-stream:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stream:
                  type: boolean
                  nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /chat/allof:
    post:
      operationId: allOfStreamCondition
      x-fern-streaming:
        format: json
        stream-condition: $request.stream
        stream-description: Streams the reply.
        stream-request-name: StreamChatRequest
        terminator: '[DONE]'
        response:
          type: string
        response-stream:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ObjectWithStream'
                - type: object
                  properties:
                    prompt:
                      type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /chat/simple:
    post:
      operationId: alwaysStreams
      x-fern-streaming: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /chat/sse:
    post:
      operationId: sseStream
      x-fern-streaming:
        format: sse
        resumable: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /chat/disabled:
    post:
      operationId: notStreaming
      x-fern-streaming: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

components:
  schemas:
    ObjectWithStream:
      type: object
      properties:
        stream:
          type: boolean
