openapi: 3.0.3
info:
  title: Chat
  version: 1.0.0
paths:
  /chat:
    post:
      operationId: streamConditionButNoResponse
      x-fern-streaming:
        stream-condition: $request.stream
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stream:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /chat/only-stream:
    post:
      operationId: streamConditionWithoutResponse
      x-fern-streaming:
        stream-condition: $request.stream
        response-stream:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stream:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
