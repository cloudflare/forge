openapi: 3.0.3
info:
  title: Chat
  version: 1.0.0
paths:
  /chat:
    post:
      operationId: missingPropertyStreamCondition
      x-fern-streaming:
        stream-condition: $request.stream
        response:
          type: string
        response-stream:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectWithoutStream'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

components:
  schemas:
    ObjectWithoutStream:
      type: object
      properties:
        notStream:
          type: boolean
