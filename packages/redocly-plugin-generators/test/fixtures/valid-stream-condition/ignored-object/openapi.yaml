openapi: 3.0.3
info:
  title: Chat
  version: 1.0.0
paths:
  /chat:
    post:
      operationId: neitherFormatNorCondition
      x-fern-streaming:
        terminator: '[DONE]'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string

  /chat/response-only:
    post:
      operationId: responseStreamOnly
      x-fern-streaming:
        format: sse
        response-stream:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
