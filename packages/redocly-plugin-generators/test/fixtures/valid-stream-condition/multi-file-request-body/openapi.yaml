openapi: 3.0.3
info:
  title: Chat
  version: 1.0.0
paths:
  /chat:
    post:
      operationId: chat
      x-fern-streaming:
        stream-condition: $request.stream
        response:
          $ref: ./schemas.yaml#/ChatResponse
        response-stream:
          $ref: ./schemas.yaml#/ChatChunk
      requestBody:
        $ref: ./schemas.yaml#/ChatRequestBody
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
