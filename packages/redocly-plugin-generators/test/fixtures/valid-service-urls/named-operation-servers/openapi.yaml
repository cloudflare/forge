openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
servers:
  - url: https://api.example.com
    x-fern-server-name: Production
paths:
  /files:
    post:
      operationId: uploadFile
      servers:
        - url: https://upload.example.com
          x-fern-server-name: Upload
      responses:
        '200':
          description: OK
  /files/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: replaceFile
      x-fern-server-name: Upload
      responses:
        '200':
          description: OK
    get:
      operationId: getFile
      x-fern-server-name: Base
      responses:
        '200':
          description: OK
  /downloads:
    servers:
      - url: https://download.example.com
        x-name: Download
    get:
      operationId: download
      responses:
        '200':
          description: OK
