openapi: 3.1.0
info:
  title: Users
  version: 1.0.0
x-shared:
  User:
    type: object
    properties:
      id:
        type: string
paths:
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/x-shared/User'
