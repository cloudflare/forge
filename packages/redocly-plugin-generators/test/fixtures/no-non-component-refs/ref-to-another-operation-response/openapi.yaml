openapi: 3.1.0
info:
  title: Users
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
  /admins:
    get:
      operationId: listAdmins
      responses:
        '200':
          $ref: '#/paths/~1users/get/responses/200'
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
