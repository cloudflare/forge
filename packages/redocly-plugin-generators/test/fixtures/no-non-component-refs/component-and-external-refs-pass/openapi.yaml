openapi: 3.1.0
info:
  title: Users
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Users'
  /teams:
    get:
      operationId: listTeams
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './schemas.yaml#/Team'
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
  responses:
    Users:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/User'
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
