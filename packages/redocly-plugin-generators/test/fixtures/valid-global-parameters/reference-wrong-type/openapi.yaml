openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
x-fern-global-parameters:
  - name: currency
    in: query
paths:
  /pets:
    get:
      operationId: listPets
      x-fern-global-parameter:
        name: currency
      responses:
        '200':
          description: OK
    post:
      operationId: createPet
      x-fern-global-parameter: [currency, 7]
      responses:
        '200':
          description: OK
