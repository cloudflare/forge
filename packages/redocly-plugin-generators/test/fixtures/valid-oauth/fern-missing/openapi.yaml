openapi: 3.0.3
info:
  title: Auth
  version: 1.0.0
paths:
  /token:
    post:
      operationId: getTokenWithClientCredentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                audience:
                  type: string
                  enum: [https://api.example.com]
                grant_type:
                  type: string
                  enum: [client_credentials]
                scope:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /token/refresh:
    post:
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                refresh_token:
                  type: string
                grant_type:
                  type: string
                  enum: [refresh_token]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

components:
  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
          nullable: true
