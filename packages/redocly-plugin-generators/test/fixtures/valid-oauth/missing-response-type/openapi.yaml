openapi: 3.0.3
info:
  title: Auth
  version: 1.0.0
paths:
  /token:
    post:
      operationId: getToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
      responses:
        '204':
          description: No content
  /token/stream:
    post:
      operationId: streamToken
      x-fern-streaming: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
