openapi: 3.0.3
info:
  title: Auth
  version: 1.0.0
paths:
  /token:
    post:
      operationId: getToken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: integer
                scopes:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: object
                    properties:
                      value:
                        type: string
                  expires_in:
                    type: number
