openapi: 3.1.0
info:
  title: Users
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: OK
    post:
      operationId: createUser
      responses:
        '201':
          description: Created
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /users/me:
    post:
      operationId: updateMe
      responses:
        '200':
          description: OK
  /users/{id}/posts:
    get:
      operationId: listPosts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
  /Users/me:
    get:
      operationId: getMeCapitalized
      responses:
        '200':
          description: OK
