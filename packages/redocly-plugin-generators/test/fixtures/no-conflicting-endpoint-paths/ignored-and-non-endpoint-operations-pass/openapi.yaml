openapi: 3.1.0
info:
  title: Users
  version: 1.0.0
paths:
  /users/me:
    get:
      operationId: getMe
      x-fern-ignore: true
      responses:
        '200':
          description: OK
    options:
      operationId: optionsMe
      responses:
        '200':
          description: OK
    post:
      operationId: meWebhook
      x-fern-webhook: true
      responses:
        '200':
          description: OK
  /users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    options:
      operationId: optionsUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
    post:
      operationId: postUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
webhooks:
  userCreated:
    get:
      operationId: userCreatedWebhook
      responses:
        '200':
          description: OK
