      oneOf:
        - $ref: '#/components/schemas/A'
      discriminator:
        propertyName: _type
        mapping:
          a: '#/components/schemas/A'
    WithoutMapping:
      oneOf:
        - $ref: '#/components/schemas/A'
      discriminator:
        propertyName: _type
