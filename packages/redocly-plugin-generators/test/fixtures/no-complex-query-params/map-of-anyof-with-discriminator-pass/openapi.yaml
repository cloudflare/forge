openapi: 3.1.0
info:
  title: Shapes
  version: 1.0.0
paths:
  /shapes:
    get:
      operationId: listShapes
      parameters:
        - name: byName
          in: query
          style: deepObject
          schema:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/Shape'
      responses:
        '200':
          description: OK
components:
  schemas:
    Shape:
      anyOf:
        - $ref: '#/components/schemas/Circle'
        - $ref: '#/components/schemas/Square'
      discriminator:
        propertyName: type
    Circle:
      type: object
      properties:
        type:
          type: string
    Square:
      type: object
      properties:
        type:
          type: string
