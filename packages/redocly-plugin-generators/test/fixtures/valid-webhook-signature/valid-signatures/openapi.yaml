openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
x-fern-webhook-signature:
  type: hmac
  header: X-Signature
  algorithm: sha256
  encoding: hex
  signature-prefix: 'sha256='
  timestamp:
    header: X-Timestamp
    format: unix-seconds
    tolerance: 300
  payload-format:
    components: [timestamp, notification-url, body]
    delimiter: '.'
  body-hash-binding:
    algorithm: sha256
    encoding: base64
    location:
      type: query-parameter
      name: bodySha256
  url-normalization:
    port-variants: true
paths:
  /hooks/pet-created:
    post:
      operationId: petCreated
      x-fern-webhook: true
      x-fern-webhook-signature:
        type: asymmetric
        header: X-Signature
        asymmetric-algorithm: ed25519
        encoding: base64
        jwks-url: https://example.com/.well-known/jwks.json
        key-id-header: X-Key-Id
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
webhooks:
  petUpdated:
    post:
      operationId: petUpdated
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
  petDeleted:
    post:
      operationId: petDeleted
      x-fern-webhook-signature: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
