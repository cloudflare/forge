openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
paths: {}
webhooks:
  a:
    post:
      operationId: a
      x-fern-webhook-signature:
        type: hmac
        header: X-Signature
        payload-format:
          components: [body, url, timestamp]
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
  b:
    post:
      operationId: b
      x-fern-webhook-signature:
        type: asymmetric
        header: X-Signature
        asymmetric-algorithm: ed25519
        jwks-url: https://example.com/jwks
        payload-format:
          delimiter: '.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
