openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
paths: {}
webhooks:
  a:
    post:
      operationId: a
      x-fern-webhook-signature:
        type: asymmetric
        header: X-Signature
        asymmetric-algorithm: rsa-sha1
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
  b:
    post:
      operationId: b
      x-fern-webhook-signature:
        type: asymmetric
        header: X-Signature
        asymmetric-algorithm: ecdsa-sha256
        key-id-header: X-Key-Id
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
