openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
paths: {}
webhooks:
  a:
    post:
      operationId: a
      x-fern-webhook-signature:
        type: hmac
        header: X-Signature
        payload-format:
          components: [body, notification-url]
        body-hash-binding:
          algorithm: sha256
          location:
            type: query-parameter
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: OK
