openapi: 3.1.0
info:
  title: Uploads
  version: 1.0.0
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              allOf:
                - $ref: '#/components/schemas/Source'
      responses:
        '200':
          description: OK
components:
  schemas:
    Source:
      oneOf:
        - type: object
          properties:
            url:
              type: string
        - type: object
          properties:
            path:
              type: string
