openapi: 3.1.0
info:
  title: Uploads
  version: 1.0.0
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/BaseUpload'
                - type: object
                  properties:
                    file:
                      type: string
                      format: binary
      responses:
        '200':
          description: OK
components:
  schemas:
    BaseUpload:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
