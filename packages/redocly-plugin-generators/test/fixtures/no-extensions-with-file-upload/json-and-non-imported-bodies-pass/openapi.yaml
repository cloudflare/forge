openapi: 3.1.0
info:
  title: Uploads
  version: 1.0.0
paths:
  /json:
    post:
      operationId: createJson
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Base'
                - type: object
                  properties:
                    extra:
                      type: string
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/Base'
                - type: object
                  properties:
                    extra:
                      type: string
      responses:
        '200':
          description: OK
  /ignored:
    post:
      operationId: ignored
      x-fern-ignore: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/Base'
                - type: object
                  properties:
                    extra:
                      type: string
      responses:
        '200':
          description: OK
components:
  schemas:
    Base:
      type: object
      properties:
        name:
          type: string
