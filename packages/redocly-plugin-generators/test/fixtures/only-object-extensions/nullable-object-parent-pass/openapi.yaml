openapi: 3.0.0
info:
  title: Nullable AllOf Extends Test
  version: 1.0.0
paths:
  /test:
    post:
      operationId: createTest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RootObject'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootObject'
components:
  schemas:
    RootObject:
      description: Object inheriting from a nullable schema via allOf.
      allOf:
        - $ref: '#/components/schemas/NormalObject'
        - $ref: '#/components/schemas/NullableObject'
      type: object
    NormalObject:
      type: object
      properties:
        normalField:
          type: string
    NullableObject:
      type: object
      nullable: true
      properties:
        nullableField:
          type: string
    Child:
      type: object
      properties:
        name:
          type: string
      allOf:
        - $ref: '#/components/schemas/NullableComposed'
    Base:
      type: object
      properties:
        id:
          type: string
    NullableComposed:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
