openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants/stream:
    get:
      operationId: streamPlants
      x-fern-streaming: true
      responses:
        '200':
          description: A stream of plants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  retryAfter:
                    type: integer
      x-fern-examples:
        - name: Valid stream
          response:
            stream:
              - name: Fern
              - name: Moss
        - name: Invalid stream item
          response:
            stream:
              - name: Fern
              - name: 3
        - name: Body instead of stream
          response:
            body:
              name: Fern
        - name: Error example on a streaming operation
          response:
            error: TooManyRequestsError
            body:
              retryAfter: soon
        - name: No response
          docs: Streaming examples may omit the response.
  /plants/chat:
    post:
      operationId: chat
      x-fern-streaming:
        stream-condition: $request.stream
        response:
          $ref: '#/components/schemas/Plant'
        response-stream:
          $ref: '#/components/schemas/Plant'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stream:
                  type: boolean
      responses:
        '200':
          description: A plant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
      x-fern-examples:
        - name: Non-streaming example checked against x-fern-streaming response
          response:
            body: not a plant
components:
  schemas:
    Plant:
      type: object
      required: [name]
      properties:
        name:
          type: string
