openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants:
    get:
      operationId: listPlants
      responses:
        '200':
          description: The plants
      x-fern-examples:
        - name: Request on an operation without a body
          request:
            name: Fern
    post:
      operationId: createPlant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantInput'
      responses:
        '201':
          description: Created
      x-fern-examples:
        - name: Valid request
          request:
            name: Fern
            soil:
              ph: 6.5
        - name: Omitted required body
          docs: The body is required.
        - name: Invalid request
          request:
            soil:
              ph: acidic
              texture: loam
            color: green
    patch:
      operationId: patchPlants
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
      responses:
        '204':
          description: Patched
      x-fern-examples:
        - name: Optional body may be omitted
          docs: requestBody.required is false.
        - name: Wrong item type
          request: [fern, 3]
  /plants/upload:
    post:
      operationId: uploadPlant
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '204':
          description: Uploaded
      x-fern-examples:
        - name: File parts of multipart bodies are unexpected
          request:
            file: 42
  /plants/notes:
    post:
      operationId: addNote
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        '204':
          description: Added
      x-fern-examples:
        - name: Unknown body may be omitted
          docs: The schema accepts anything.
components:
  schemas:
    PlantInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        soil:
          type: object
          properties:
            ph:
              type: number
