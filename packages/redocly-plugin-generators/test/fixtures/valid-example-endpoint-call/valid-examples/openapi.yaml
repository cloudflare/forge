openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants/{plantId}:
    parameters:
      - name: plantId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: updatePlant
      parameters:
        - name: dryRun
          in: query
          schema:
            type: boolean
        - name: tags
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
        - name: X-Request-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlantInput'
      responses:
        '200':
          description: The updated plant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-fern-examples:
        - name: Rename a fern
          docs: Renames the plant.
          path-parameters:
            plantId: fern-1
          query-parameters:
            dryRun: true
            tags: [shade, indoor]
          headers:
            X-Request-Id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          request:
            name: Boston fern
            wateringDays: 3
          response:
            body:
              id: fern-1
              name: Boston fern
              wateringDays: 3
        - name: Single tag
          path-parameters:
            plantId: fern-1
          query-parameters:
            tags: shade
          headers:
            X-Request-Id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          request:
            name: Boston fern
          response:
            body:
              id: fern-1
              name: Boston fern
        - name: Missing plant
          path-parameters:
            plantId: unknown
          headers:
            X-Request-Id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
          request:
            name: Boston fern
          response:
            error: NotFoundError
            body:
              title: Not found
        - code-samples:
            - sdk: python
              code: client.update_plant("fern-1", name="Boston fern")
            - language: shell
              name: cURL
              code: curl -X PUT https://api.example.com/plants/fern-1
components:
  schemas:
    PlantInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        wateringDays:
          type: integer
          minimum: 1
    Plant:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        wateringDays:
          type: integer
    Problem:
      type: object
      required: [title]
      properties:
        title:
          type: string
