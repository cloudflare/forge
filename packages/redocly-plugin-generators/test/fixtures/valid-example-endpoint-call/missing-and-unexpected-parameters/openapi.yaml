openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /gardens/{gardenId}/plants/{plantId}:
    parameters:
      - name: gardenId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPlant
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
        - name: units
          in: query
          required: true
          schema:
            type: string
        - name: fields
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
        - name: cursor
          in: query
          required: true
          schema:
            type: string
            nullable: true
        - name: verbose
          in: query
          schema:
            type: boolean
        - name: X-Garden-Token
          in: header
          required: true
          schema:
            type: string
        - name: X-Anything
          in: header
          required: true
          schema: {}
        - name: X-Debug
          in: header
          schema:
            type: boolean
      responses:
        '200':
          description: The plant
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
      x-fern-examples:
        - name: Everything required
          path-parameters:
            gardenId: g1
            plantId: p1
          query-parameters:
            units: metric
          headers:
            X-Garden-Token: secret
          response:
            body:
              name: Fern
        - name: Nothing given
          response:
            body:
              name: Fern
        - name: Extra keys
          path-parameters:
            gardenId: g1
            plantId: p1
            bedId: b1
          query-parameters:
            units: metric
            page: 2
          headers:
            X-Garden-Token: secret
            X-Unknown: value
          response:
            body:
              name: Fern
        - name: Null values count as missing
          path-parameters:
            gardenId: g1
            plantId: null
          query-parameters:
            units: metric
          headers:
            X-Garden-Token: secret
          response:
            body:
              name: Fern
