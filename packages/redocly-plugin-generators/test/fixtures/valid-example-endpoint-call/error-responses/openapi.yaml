openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants/{plantId}:
    get:
      operationId: getPlant
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The plant
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '4XX':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Unavailable
      x-fern-examples:
        - name: Valid not found
          path-parameters:
            plantId: p1
          response:
            error: NotFoundError
            body:
              title: Not found
        - name: Wildcard error
          path-parameters:
            plantId: p1
          response:
            error: ClientRequestError
            body:
              title: Bad request
        - name: Error without a schema accepts any body
          path-parameters:
            plantId: p1
          response:
            error: ServiceUnavailableError
            body: down for maintenance
        - name: Undeclared error
          path-parameters:
            plantId: p1
          response:
            error: InternalServerError
            body:
              title: Boom
        - name: Error named after the OpenAPI description
          path-parameters:
            plantId: p1
          response:
            error: Not found
        - name: Invalid error body
          path-parameters:
            plantId: p1
          response:
            error: NotFoundError
            body:
              title: 404
        - name: Missing error body
          path-parameters:
            plantId: p1
          response:
            error: NotFoundError
  /plants:
    get:
      operationId: listPlants
      responses:
        '200':
          description: The plants
      x-fern-examples:
        - name: No errors declared
          response:
            error: NotFoundError
components:
  schemas:
    Problem:
      type: object
      required: [title]
      properties:
        title:
          type: string
