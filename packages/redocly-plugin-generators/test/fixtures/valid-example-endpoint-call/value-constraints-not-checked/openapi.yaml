openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants:
    post:
      operationId: createPlant
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: code, in: query, schema: { type: string, pattern: '^a+$', maxLength: 3 } }
        - { name: lim2, in: query, schema: { $ref: '#/components/schemas/Limit' } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                n: { type: integer, maximum: 10, minimum: 1 }
                s: { type: string, pattern: '^a+$', minLength: 2, maxLength: 3, format: email }
                l: { type: array, items: { type: string }, maxItems: 1 }
                u: { type: array, uniqueItems: true, items: { type: string } }
                m: { type: number, multipleOf: 5 }
                named: { $ref: '#/components/schemas/Limit' }
                namedS: { $ref: '#/components/schemas/Code' }
      responses:
        '204': { description: OK }
      x-fern-examples:
        - name: Values outside minimum, maximum, pattern, length and item constraints
          query-parameters: { limit: 500, code: bbbbb, lim2: 500 }
          request: { n: 50, s: bbbbbbb, l: [x, y], u: [x, x], m: 3, named: 500, namedS: zzzzz }
components:
  schemas:
    Limit: { type: integer, maximum: 100 }
    Code: { type: string, pattern: '^a+$', maxLength: 3 }
