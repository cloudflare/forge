openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /oauth/token:
    post:
      operationId: getToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                scope:
                  type: string
      responses:
        '200':
          description: The token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
      x-fern-examples:
        - name: Valid form body
          request:
            grant_type: client_credentials
          response:
            body:
              access_token: abc
        - name: Invalid form body
          request:
            grant_type: password
            username: fern
          response:
            body:
              access_token: abc
