openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
x-fern-global-headers:
  - header: X-Org-Id
    name: orgId
  - header: X-Trace
    optional: true
  - header: X-Api-Version
    type: integer
  - header: X-Region
    type: optional<string>
paths:
  /plants:
    get:
      operationId: listPlants
      parameters:
        - name: X-Org-Id
          in: header
          schema:
            type: string
      responses:
        '200':
          description: The plants
      x-fern-examples:
        - name: All required global headers
          headers:
            X-Org-Id: org-1
            X-Api-Version: 2
        - name: Optional global headers
          headers:
            X-Org-Id: org-1
            X-Api-Version: 2
            X-Trace: abc
            X-Region: eu
        - name: Missing and invalid global headers
          headers:
            X-Api-Version: two
