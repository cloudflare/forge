components:
  parameters:
    PlantId:
      name: plantId
      in: path
      required: true
      schema:
        type: integer
  schemas:
    Plant:
      type: object
      required: [name]
      properties:
        name:
          type: string
        soil:
          $ref: '#/components/schemas/Soil'
    Soil:
      type: object
      required: [ph]
      properties:
        ph:
          type: number
