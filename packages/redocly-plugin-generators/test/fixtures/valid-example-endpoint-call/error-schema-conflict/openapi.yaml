openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants:
    get:
      operationId: listPlants
      responses:
        '200':
          description: The plants
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      x-fern-examples:
        - name: Conflicting 400 schemas make the error body unknown
          response:
            error: BadRequestError
            body: anything goes
        - name: The 409 schema is the same everywhere
          response:
            error: ConflictError
            body: not a problem object
  /gardens:
    get:
      operationId: listGardens
      responses:
        '200':
          description: The gardens
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Problem:
      type: object
      required: [title]
      properties:
        title:
          type: string
