openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants/{plantId}:
    get:
      operationId: getPlant
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, height]
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: integer
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
        - name: X-Request-Id
          in: header
          schema:
            type: string
            pattern: '^req-[0-9]+$'
        - name: X-Plain
          in: header
      responses:
        '200':
          description: The plant
      x-fern-examples:
        - name: Valid values
          path-parameters:
            plantId: 7
          query-parameters:
            sort: height
            ids: [1, 2]
            limit: 100
          headers:
            X-Request-Id: req-1
            X-Plain: anything
        - name: Invalid values
          path-parameters:
            plantId: '7'
          query-parameters:
            sort: color
            ids: [1, two, 3]
            limit: 500
          headers:
            X-Request-Id: request-1
            X-Plain: 5
        - name: Single value for a list parameter
          path-parameters:
            plantId: 7
          query-parameters:
            ids: nine
        - name: Strings starting with $ are not validated
          path-parameters:
            plantId: $plantId
