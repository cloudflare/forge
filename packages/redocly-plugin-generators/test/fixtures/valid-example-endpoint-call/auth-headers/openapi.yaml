openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /plants:
    get:
      operationId: listPlants
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
        - name: Content-Type
          in: header
          schema:
            type: string
      responses:
        '200':
          description: The plants
      x-fern-examples:
        - name: Lists auth headers
          headers:
            Authorization: Bearer token
            Content-Type: application/json
            X-Api-Key: key
        - name: Omits the extra API key header
          headers: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
