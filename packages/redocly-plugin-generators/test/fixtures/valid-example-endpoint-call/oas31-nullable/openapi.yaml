openapi: 3.1.0
info:
  title: Plants
  version: 1.0.0
paths:
  /plants:
    get:
      operationId: listPlants
      parameters:
        - name: cursor
          in: query
          required: true
          schema:
            type: [string, 'null']
      responses:
        '200':
          description: The plants
          content:
            application/json:
              schema:
                type: object
                required: [kind, nickname]
                properties:
                  kind:
                    const: plant
                  nickname:
                    type: [string, 'null']
      x-fern-examples:
        - name: Nullable values
          query-parameters:
            cursor: null
          response:
            body:
              kind: plant
              nickname: null
        - name: Const and type mismatches
          response:
            body:
              kind: tree
              nickname: 5
