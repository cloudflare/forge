openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants/photos:
    post:
      operationId: uploadPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
      responses:
        '204':
          description: Uploaded
      x-fern-examples:
        - name: Only non-file parts
          request:
            caption: A fern
            width: 640
        - name: Wrong part types and missing caption
          request:
            width: wide
            tags: [1]
        - name: File parts and unknown parts
          request:
            caption: A fern
            photo: photo.jpg
            thumbnails: [a.jpg]
            album: summer
        - name: Not an object
          request: photo.jpg
components:
  schemas:
    PhotoUpload:
      type: object
      required: [photo, caption]
      properties:
        photo:
          type: string
          format: binary
        thumbnails:
          type: array
          items:
            type: string
            format: binary
        caption:
          type: string
        width:
          type: integer
        tags:
          type: array
          items:
            type: string
