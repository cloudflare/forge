openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants:
    post:
      operationId: createPlant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plant'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
      x-fern-examples:
        - name: Read-only property omitted from the request
          request:
            name: Fern
            nickname: null
          response:
            body:
              id: p1
              name: Fern
              nickname: null
        - name: Read-only property in the request
          request:
            id: p1
            name: Fern
          response:
            body:
              id: p1
              name: Fern
        - name: Null for a non-nullable property
          request:
            name: null
          response:
            body:
              id: p1
              name: Fern
components:
  schemas:
    Plant:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        nickname:
          type: string
          nullable: true
