openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants:
    get:
      operationId: listPlants
      responses:
        '200':
          description: The plants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      x-fern-examples:
        - name: Stream on a regular operation
          response:
            stream:
              - fern
              - moss
    delete:
      operationId: deletePlants
      responses:
        '204':
          description: Deleted
      x-fern-examples:
        - name: Stream on an operation without a response body
          response:
            stream:
              - fern
