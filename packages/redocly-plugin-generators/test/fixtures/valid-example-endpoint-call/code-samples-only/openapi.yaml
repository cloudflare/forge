openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants/{plantId}:
    get:
      operationId: getPlant
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The plant
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
      x-fern-examples:
        - name: Only code samples
          docs: Fern does not validate entries that only carry code samples.
          code-samples:
            - sdk: typescript
              code: await client.getPlant("p1");
            - language: go
              install: go get example.com/plants
              code: client.GetPlant("p1")
