openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
servers:
  - url: https://api.example.com
    x-fern-server-name: Production
  - url: https://api-staging.example.com
    x-fern-server-name: Staging
paths:
  /files:
    post:
      operationId: uploadFile
      servers:
        - url: https://upload-staging.example.com
          x-fern-server-name: Upload
      responses:
        '200':
          description: OK
  /images:
    post:
      operationId: uploadImage
      servers:
        - url: https://images-staging.example.com
          x-fern-server-name: Upload
      responses:
        '200':
          description: OK
