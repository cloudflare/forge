openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
  /plants:
    post:
      operationId: createPlant
      parameters:
        - name: q
          in: query
          x-fern-parameter-name: name
          schema:
            type: string
        - name: body
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: [object, 'null']
              properties:
                name:
                  type: string
      responses:
        '200':
          description: OK
  /plants/{plantId}:
    put:
      operationId: replacePlant
      x-fern-streaming: true
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
        - name: body
          in: query
          schema:
            type: string
        - name: q
          in: query
          x-fern-parameter-name: name
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plant'
      responses:
        '200':
          description: OK
components:
  schemas:
    Plant:
      type: object
      properties:
        name:
          type: string
