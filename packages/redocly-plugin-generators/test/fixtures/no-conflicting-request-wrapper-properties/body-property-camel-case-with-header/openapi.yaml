openapi: 3.0.3
info:
  title: Test API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
  /plants:
    post:
      operationId: createPlant
      parameters:
        - name: X-Org-Id
          in: header
          schema:
            type: string
        - name: page_size
          in: query
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                org_id:
                  type: string
                pageSize:
                  type: integer
      responses:
        '200':
          description: OK
