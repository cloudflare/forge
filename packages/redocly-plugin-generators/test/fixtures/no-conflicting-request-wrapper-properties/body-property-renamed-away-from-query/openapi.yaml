openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
  /plants:
    post:
      operationId: createPlant
      parameters:
        - name: name
          in: query
          schema:
            type: string
        - name: X-Org-Id
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                organization:
                  type: string
                  x-fern-property-name: orgId
      responses:
        '200':
          description: OK
