openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
  /identifiers/{idType}:
    patch:
      operationId: update
      parameters:
        - name: idType
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idType:
                  type: string
                oldValue:
                  type: string
                newValue:
                  type: string
      responses:
        '200':
          description: OK
