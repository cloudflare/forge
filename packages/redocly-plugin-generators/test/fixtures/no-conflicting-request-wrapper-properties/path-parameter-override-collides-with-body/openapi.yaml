openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
  /identifiers/{id}:
    patch:
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          x-fern-parameter-name: idType
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idType:
                  type: string
      responses:
        '200':
          description: OK
