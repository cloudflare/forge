openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
  /plants/{body}:
    put:
      operationId: replacePlant
      parameters:
        - name: body
          in: path
          required: true
          schema:
            type: string
        - name: body
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Plant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plant'
components:
  schemas:
    Plant:
      type: object
      properties:
        name:
          type: string
