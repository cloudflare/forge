openapi: 3.0.3
info:
  title: Test API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
  /plants/{plant_id}:
    $ref: ./paths/plant.yaml
components:
