openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
  /plants:
    put:
      operationId: replacePlant
      parameters:
        - name: plant_id
          in: query
          x-fern-parameter-name: id
          schema:
            type: string
        - name: tag
          in: query
          x-fern-parameter-name: label
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  readOnly: true
                label:
                  type: string
                  x-fern-ignore: true
      responses:
        '200':
          description: OK
  /plants/{request}:
    post:
      operationId: ignored
      x-fern-ignore: true
      parameters:
        - name: request
          in: path
          required: true
          schema:
            type: string
        - name: X-Request
          in: header
          schema:
            type: string
      responses:
        '200':
          description: OK
