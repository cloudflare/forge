openapi: 3.1.0
info:
  title: Test API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
  /plants/{plantId}/photo:
    post:
      operationId: uploadPhoto
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
        - name: caption
          in: query
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                caption:
                  type: string
                plantId:
                  type: string
      responses:
        '200':
          description: OK
