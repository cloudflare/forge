openapi: 3.1.0
info:
  title: Parents
  version: 1.0.0
paths: {}
components:
  schemas:
    Child:
      type: object
      properties:
        name:
          type: string
      allOf:
        - $ref: '#/components/schemas/Pet'
        - $ref: '#/components/schemas/Source'
        - $ref: '#/components/schemas/CustomType'
    Pet:
      type: object
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/Cat'
    Cat:
      type: object
      properties:
        kind:
          type: string
    Source:
      oneOf:
        - type: string
        - type: integer
    CustomType:
      x-fern-type: commons.Base
