openapi: 3.1.0
info:
  title: Aliases
  version: 1.0.0
paths: {}
components:
  schemas:
    Name:
      description: A name.
      allOf:
        - $ref: '#/components/schemas/NameString'
    NameString:
      type: string
    Child:
      type: object
      properties:
        name:
          type: string
      allOf:
        - $ref: '#/components/schemas/AliasOfBase'
        - $ref: '#/components/schemas/AllOfAliasOfOtherBase'
        - $ref: '#/components/schemas/ComposedBase'
    Base:
      type: object
      properties:
        id:
          type: string
    OtherBase:
      type: object
      properties:
        label:
          type: string
    ThirdBase:
      type: object
      properties:
        code:
          type: string
    AliasOfBase:
      $ref: '#/components/schemas/Base'
    AllOfAliasOfOtherBase:
      allOf:
        - $ref: '#/components/schemas/OtherBase'
    ComposedBase:
      allOf:
        - $ref: '#/components/schemas/ThirdBase'
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
