openapi: 3.1.0
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants:
    get:
      tags: [plants]
      operationId: listPlants
      responses:
        '200':
          description: The plants.
          content:
            application/json:
              schema:
                type: object
                x-fern-type-name: Plant
                properties:
                  name:
                    type: string
components:
  schemas:
    Plant:
      type: object
      properties:
        height:
          type: number
