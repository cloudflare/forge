openapi: 3.1.0
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants:
    get:
      operationId: listPlants
      x-fern-request-name: Plant
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: The plants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plant'
components:
  schemas:
    Plant:
      type: object
      properties:
        name:
          type: string
