openapi: 3.1.0
info:
  title: Plant Store
  version: 1.0.0
paths:
  /photos:
    post:
      operationId: uploadPhoto
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhotoUpload'
      responses:
        '204':
          description: Uploaded.
components:
  schemas:
    PhotoUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
    photo_upload:
      type: object
      properties:
        id:
          type: string
