openapi: 3.1.0
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants:
    get:
      operationId: listPlants
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: The plants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPlantsRequest'
components:
  schemas:
    ListPlantsRequest:
      type: object
      properties:
        limit:
          type: integer
