openapi: 3.1.0
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants:
    post:
      operationId: createPlant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPlant'
      responses:
        '204':
          description: Created.
  /plants/bulk:
    post:
      operationId: createPlants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPlant'
      responses:
        '204':
          description: Created.
  /plants/{plantId}:
    put:
      operationId: replacePlant
      x-fern-request-name: ReplacePlantRequest
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPlant'
      responses:
        '204':
          description: Replaced.
components:
  schemas:
    NewPlant:
      type: object
      properties:
        name:
          type: string
