openapi: 3.0.3
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants:
    post:
      operationId: createPlant
      requestBody:
        $ref: '#/components/requestBodies/PlantBody'
      responses:
        '204':
          description: Created.
  /plants/{plantId}:
    put:
      operationId: replacePlant
      x-fern-request-name: Plant
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/PlantBody'
      responses:
        '204':
          description: Replaced.
components:
  requestBodies:
    PlantBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewPlant'
  schemas:
    NewPlant:
      type: object
      properties:
        name:
          type: string
    Plant:
      type: object
      properties:
        id:
          type: string
