openapi: 3.1.0
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants/{plantId}/seeds:
    get:
      x-fern-sdk-group-name: [plants, seeds]
      x-fern-sdk-method-name: list
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The seeds.
  /plants/{plantId}/bulbs:
    get:
      x-fern-sdk-group-name: [plants, bulbs]
      x-fern-sdk-method-name: list
      x-fern-request-name: ListSeedsRequest
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The bulbs.
