openapi: 3.1.0
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants:
    get:
      operationId: listPlants
      x-fern-request-name: PlantQuery
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: The plants.
  /trees:
    get:
      operationId: listTrees
      x-request-name: PlantQuery
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: The trees.
  /bushes:
    get:
      operationId: listBushes
      x-fern-request-name: PlantQuery
      responses:
        '200':
          description: Has no parameters, so Fern creates no request.
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
