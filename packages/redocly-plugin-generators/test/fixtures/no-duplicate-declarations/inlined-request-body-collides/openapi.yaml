openapi: 3.1.0
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants:
    post:
      operationId: createPlant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPlant'
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Seedling'
components:
  schemas:
    NewPlant:
      type: object
      properties:
        name:
          type: string
    Seedling:
      x-fern-type-name: NewPlant
      type: object
      properties:
        id:
          type: string
