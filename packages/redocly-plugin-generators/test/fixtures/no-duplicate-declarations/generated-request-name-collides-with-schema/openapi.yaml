openapi: 3.1.0
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants:
    post:
      operationId: createPlant
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: The request that was received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePlantRequest'
components:
  schemas:
    CreatePlantRequest:
      type: object
      properties:
        name:
          type: string
