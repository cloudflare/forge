openapi: 3.1.0
info:
  title: Auth
  version: 1.0.0
paths:
  /items:
    get:
      operationId: listItems
      security:
        - partnerKey: []
      responses:
        '200':
          description: OK
  /users:
    get:
      operationId: listUsers
      security:
