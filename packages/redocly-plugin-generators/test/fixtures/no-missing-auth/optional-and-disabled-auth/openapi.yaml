openapi: 3.1.0
info:
  title: Auth
  version: 1.0.0
security:
  - cookie: []
paths:
  /optional:
    get:
      operationId: optional
      security:
        - {}
        - cookie: []
      responses:
        '200':
          description: OK
  /public:
    get:
      operationId: public
      security: []
      responses:
        '200':
          description: OK
  /ignored:
    get:
      operationId: ignored
      x-fern-ignore: true
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: session
