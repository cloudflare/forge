openapi: 3.1.0
info:
  title: Auth
  version: 1.0.0
paths:
  /cookie:
    get:
      operationId: cookie
      security:
        - cookie: []
      responses:
        '200':
          description: OK
  /missing:
    get:
      operationId: missing
      security:
        - missingScheme: []
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    cookie:
      type: apiKey
      in: cookie
      name: session
    unused:
      type: http
      scheme: basic
