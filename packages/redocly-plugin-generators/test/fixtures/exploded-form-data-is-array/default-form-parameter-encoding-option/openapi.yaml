openapi: 3.1.0
info:
  title: Uploads
  version: 1.0.0
paths:
  /upload:
    post:
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                note:
                  type: string
            encoding:
              name:
                explode: true
              note:
                explode: true
                contentType: text/plain
      responses:
        '200':
          description: OK
