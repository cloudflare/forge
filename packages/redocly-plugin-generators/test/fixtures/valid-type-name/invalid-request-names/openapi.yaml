openapi: 3.0.3
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants:
    get:
      operationId: listPlants
      x-fern-request-name: _ListPlantsRequest
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: The plants.
    post:
      operationId: createPlant
      requestBody:
        content:
          application/json:
            schema:
              x-fern-type-name: _CreatePlantBody
              type: object
              properties:
                name:
                  type: string
      responses:
        '204':
          description: Created.
  /trees:
    get:
      operationId: listTrees
      x-request-name: 2TreesRequest
      responses:
        '200':
          description: The trees.
