openapi: 3.0.3
info:
  title: Users
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsersByUri
      x-fern-pagination:
        next_uri: $response.links.next
        results: $response.data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paged'
  /users/by-path:
    get:
      operationId: listUsersByPath
      x-fern-pagination:
        next_path: $response.links.count
        results: $response.data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paged'
  /users/by-bad-uri:
    get:
      operationId: listUsersByBadUri
      x-fern-pagination:
        next_uri: $response.links.count
        results: $response.data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Paged'
components:
  schemas:
    Paged:
      type: object
      properties:
        links:
          type: object
          properties:
            next:
              type: string
              format: uri
            count:
              type: integer
        data:
          type: array
          items:
            type: string
