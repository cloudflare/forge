openapi: 3.0.3
info:
  title: Users
  version: 1.0.0
x-fern-pagination:
  offset: $request.offset
  results: $response.results
paths:
  /users:
    post:
      operationId: listWithInvalidGlobalConfig
      x-fern-pagination: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                starting_after:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'

components:
  schemas:
    ListUsersResponse:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/Page'
        total_count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        hasNextPage:
          type: boolean
        valid:
          type: boolean
    Page:
      type: object
      nullable: true
      properties:
        page:
          type: integer
        next:
          $ref: '#/components/schemas/NextPage'
    NextPage:
      type: object
      properties:
        page:
          type: integer
        starting_after:
          type: string
    User:
      type: object
      properties:
        name:
          type: string
        id:
          type: integer
