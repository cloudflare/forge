openapi: 3.0.3
info:
  title: Users
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsersNoContent
      x-fern-pagination:
        cursor: $request.cursor
        next_cursor: $response.next
        results: $response.data
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '204':
          description: No content
  /users/text:
    get:
      operationId: listUsersText
      x-fern-pagination:
        type: custom
        results: $response.data
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
  /users/errors-only:
    get:
      operationId: listUsersErrorsOnly
      x-fern-pagination:
        next_uri: $response.next
        results: $response.data
      responses:
        '404':
          description: Not found
  /users/stream:
    post:
      operationId: streamUsers
      x-fern-streaming:
        format: sse
      x-fern-pagination:
        next_path: $response.next
        results: $response.data
      responses:
        '200':
          description: OK
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  next:
                    type: string
                  data:
                    type: array
                    items:
                      type: string
