openapi: 3.1.0
info:
  title: Users
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsersArrayItem
      x-fern-pagination:
        cursor: $request.cursor
        next_cursor: $response.pages.next
        results: $response.data
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        next:
                          type: string
                  data:
                    type: array
                    items:
                      type: string
  /users/default:
    get:
      operationId: listUsersDefaultResponse
      x-fern-pagination:
        cursor: $request.cursor
        next_cursor: $response.meta.next
        results: $response.data
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        default:
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WithMeta'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string
  /users/map:
    get:
      operationId: listUsersMap
      x-fern-pagination:
        cursor: $request.cursor
        next_cursor: $response.meta.next
        results: $response.data
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    additionalProperties:
                      type: string
                  data:
                    type: array
                    items:
                      type: string
components:
  schemas:
    WithMeta:
      type: object
      properties:
        meta:
          oneOf:
            - type: object
              properties:
                next:
                  type: string
            - type: 'null'
