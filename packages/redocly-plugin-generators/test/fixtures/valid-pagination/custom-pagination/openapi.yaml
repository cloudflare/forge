openapi: 3.0.3
info:
  title: Users
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsersCustom
      x-fern-pagination:
        type: custom
        results: $response.items
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
  /users/broken:
    get:
      operationId: listUsersCustomBroken
      x-fern-pagination:
        type: custom
        results: $response.missing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: string
