openapi: 3.0.3
info:
  title: Users
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listUsers
      x-fern-pagination:
        cursor: $request.cursor
        next_cursor: $response.next
        results: $response.data
      parameters:
        - name: cursor
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  next:
                    type: integer
                    format: int64
                  data:
                    type: object
                    properties:
                      users:
                        type: array
                        items:
                          type: string
