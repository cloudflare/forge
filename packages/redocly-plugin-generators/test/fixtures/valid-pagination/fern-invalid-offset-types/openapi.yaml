openapi: 3.0.3
info:
  title: Users
  version: 1.0.0
paths:
  /users:
    get:
      operationId: listWithInvalidOffsetPaginationType
      x-fern-pagination:
        offset: $request.starting_after
        results: $response.data
        has-next-page: $response.hasNextPage
      parameters:
        - name: starting_after
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
  /users/stepped:
    get:
      operationId: listWithInvalidOffsetStepPaginationType
      x-fern-pagination:
        offset: $request.starting_after
        results: $response.data
        step: $request.limit
      parameters:
        - name: starting_after
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'

components:
  schemas:
    ListUsersResponse:
      type: object
      properties:
        page:
          $ref: '#/components/schemas/Page'
        total_count:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        hasNextPage:
          type: boolean
        valid:
          type: boolean
    Page:
      type: object
      nullable: true
      properties:
        page:
          type: integer
        next:
          $ref: '#/components/schemas/NextPage'
    NextPage:
      type: object
      properties:
        page:
          type: integer
        starting_after:
          type: string
    User:
      type: object
      properties:
        name:
          type: string
        id:
          type: integer
