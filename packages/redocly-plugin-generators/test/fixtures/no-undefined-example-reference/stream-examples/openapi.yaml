openapi: 3.1.0
info:
  title: Plants
  version: 1.0.0
paths:
  /plants/stream:
    get:
      operationId: streamPlants
      x-fern-streaming: true
      responses:
        '200':
          description: A stream of plant names
          content:
            application/json:
              schema:
                type: string
      x-fern-examples:
        - response:
            stream: [fern, $Plant.Fern]
  /plants/events:
    get:
      operationId: plantEvents
      responses:
        '200':
          description: Server-sent plant events
          content:
            text/event-stream:
              schema:
                type: object
                additionalProperties: true
      x-fern-examples:
        - response:
            stream:
              - event: $Event.Name
                data:
                  plant: $Plant.Moss
  /plants:
    get:
      operationId: listPlants
      responses:
        '200':
          description: The plants
      x-fern-examples:
        - name: Stream on a non-streaming operation is ignored
          response:
            stream: [$Plant.Fern]
