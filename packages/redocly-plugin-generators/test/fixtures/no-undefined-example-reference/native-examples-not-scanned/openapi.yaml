openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants:
    post:
      operationId: createPlant
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
            example:
              name: $Plant.Example
            examples:
              fern:
                value:
                  name: $Plant.Fern
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: string
                example: $Plant.Example
