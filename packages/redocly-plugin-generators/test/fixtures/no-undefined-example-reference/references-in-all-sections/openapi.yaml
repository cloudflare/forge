openapi: 3.0.3
info:
  title: Plants
  version: 1.0.0
paths:
  /plants/{plantId}:
    put:
      operationId: updatePlant
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: array
            items:
              type: string
        - name: X-Request-Id
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: The plant
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
      x-fern-examples:
        - path-parameters:
            plantId: $PlantId.Example
          query-parameters:
            tag: [indoor, $Tag.Indoor]
          headers:
            X-Request-Id: $RequestId.One
          request:
            plant:
              soil: $Soil.Loam
          response:
            body:
              items: [$Plant.Fern]
        - path-parameters:
            plantId: p1
          response:
            error: NotFoundError
            body:
              message: $Problem.NotFound
