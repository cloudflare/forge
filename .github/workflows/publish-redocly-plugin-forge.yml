# Publishes @cloudflare/redocly-plugin-forge to npmjs.com on tag push.
#
# The plugin lints OpenAPI specs in downstream CI pipelines that may run on
# protected refs with access to secrets, so every step of this workflow is
# hardened accordingly. In particular:
#
#   - Runs on tag only, never on arbitrary PRs.
#   - Installs with --frozen-lockfile; the lockfile itself pins exact
#     versions of all transitive dependencies, including the `publint`
#     dev dep the pack-lint step uses (no `pnpm dlx` fetch at publish
#     time).
#   - Runs `pnpm audit --audit-level=high` before packaging. Fails closed on
#     any high-or-critical finding — no "warn and continue."
#   - Typechecks and runs the full unit-test suite before publishing.
#   - Publishes with `npm publish --provenance`, producing an attestation
#     that links the released tarball to this workflow run and the commit
#     the tag points at. Consumers can verify with `npm view … attestations`.
#   - Uses npm's OIDC-backed trusted-publisher flow: no long-lived publish
#     token is stored in GitHub secrets. The job's `id-token: write`
#     permission lets npm exchange the GitHub OIDC token for a short-lived
#     publish credential, scoped to this repo and this workflow. Trusted
#     publishing must be configured for the package on npmjs.com before
#     the first tag.
#   - All third-party actions (here and in the shared setup-workspace
#     composite) are pinned by commit SHA, so a re-tagged upstream
#     release cannot inject code into a run that holds OIDC credentials.
#
# Required repo settings (enforced by GitHub, not by this workflow):
#
#   - A tag ruleset matching `redocly-plugin-forge@*` with
#     `required_signatures` enabled, and `creation` restricted to the
#     release-manager bypass list. GitHub rejects unsigned or
#     unauthorized tag pushes before this workflow ever runs; duplicating
#     those checks in bash would just drift from the repo policy.
#
# Trigger: a tag of the form `redocly-plugin-forge@<version>` — the
# `<name>@<version>` form matches npm's own identifier syntax and is the
# convention changesets and other JS monorepos use.
#
# To cut a release:
#   1. Land a PR to main that bumps packages/redocly-plugin-forge/package.json
#      "version" to the new version.
#   2. After it merges, create and push a signed tag:
#        git tag -s redocly-plugin-forge@0.1.0 -m 'redocly-plugin-forge 0.1.0'
#        git push origin redocly-plugin-forge@0.1.0
#   3. This workflow then publishes the new version.

name: Publish @cloudflare/redocly-plugin-forge

on:
  push:
    tags:
      - 'redocly-plugin-forge@*'

# Only one publish job runs at a time; a second tag push queues behind the
# first rather than racing it to the registry.
concurrency:
  group: publish-redocly-plugin-forge
  cancel-in-progress: false

# Workflow-level permissions are read-only; the publish job raises just the
# two it needs (`id-token: write` for provenance, `contents: read` for the
# checkout). No job gets `contents: write`, so a compromised step cannot
# push commits or create releases.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag version matches package.json
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#redocly-plugin-forge@}"
          pkg_version=$(node -p "require('./packages/redocly-plugin-forge/package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag version ($tag_version) does not match package.json version ($pkg_version)" >&2
            exit 1
          fi
          echo "Publishing @cloudflare/redocly-plugin-forge@$pkg_version"

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # Fail closed on high or critical vulnerabilities in the plugin's
      # resolved production dependency tree before anything else touches the
      # code. Scoped to the plugin workspace so unrelated site dependencies
      # cannot block a publish; the plugin's trust model is that its own
      # prod tree is clean, not the entire monorepo.
      - name: Audit plugin dependencies
        run: pnpm --filter @cloudflare/redocly-plugin-forge audit --audit-level=high --prod

      - name: Typecheck
        run: pnpm --filter @cloudflare/redocly-plugin-forge typecheck

      - name: Test
        run: pnpm --filter @cloudflare/redocly-plugin-forge test

      # Pack and lint the tarball in one step via the plugin's own
      # `verify-pack` script (the same script PR CI runs). `pnpm pack`
      # fires `prepack` → full build, so no separate build step is needed.
      # The produced filename is captured as a step output so the Publish
      # step can reference it without re-globbing.
      - name: Build, pack, and lint
        id: pack
        working-directory: packages/redocly-plugin-forge
        run: |
          set -euo pipefail
          pnpm run verify-pack
          tarball=$(ls cloudflare-redocly-plugin-forge-*.tgz)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # Publishes via npm's OIDC-backed trusted-publisher flow. The job's
      # `id-token: write` permission lets npm exchange the GitHub OIDC
      # token for a short-lived publish credential — no long-lived
      # NPM_TOKEN secret needed. `--provenance` generates and uploads an
      # attestation tying this tarball to this workflow run and commit;
      # `--access public` is explicit so a misconfigured publishConfig
      # can't silently publish a scoped package as private.
      #
      # Trusted publishing for @cloudflare/redocly-plugin-forge must be
      # configured on npmjs.com (Package → Settings → Trusted Publishers)
      # to point at this repo and this workflow file before the first tag.
      - name: Publish
        working-directory: packages/redocly-plugin-forge
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: npm publish "./$TARBALL" --provenance --access public

      - name: Summary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Published @cloudflare/redocly-plugin-forge

          Tag: \`$VERSION\`

          Verify provenance:

          \`\`\`sh
          npm view @cloudflare/redocly-plugin-forge --json | jq .dist.attestations
          \`\`\`
          EOF
