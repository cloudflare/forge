name: CI

on:
  pull_request:
    branches: [main, feat/*]
  push:
    branches: [main, feat/*]

permissions:
  contents: read

jobs:
  check:
    name: Check, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-workspace

      - name: Lint and format check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm -r run test

      - name: Install Playwright browser
        run: pnpm --filter astro-fern exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm --filter astro-fern test:e2e

  docs-site:
    name: Docs site end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-workspace

      - name: Install Playwright browser
        run: pnpm --filter cloudflare-api-site exec playwright install --with-deps chromium

      # The tests run against `astro preview`, which serves the last build.
      - name: Build
        run: pnpm --filter cloudflare-api-site build

      - name: Run end-to-end tests
        run: pnpm --filter cloudflare-api-site test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-e2e-results
          path: packages/cloudflare-api-site/e2e/__test-results__
          retention-days: 7
