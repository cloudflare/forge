# Deploys the Forge docs site (`packages/docs`) from `main`, to the `forge-docs`
# Worker's workers.dev address until it has a domain.

name: Deploy Forge docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-forge-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-forge-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Forge docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-workspace

      # `cf deploy` builds the site and deploys it. `run` is needed because
      # `pnpm deploy` is a built-in pnpm command.
      - name: Build and deploy
        run: pnpm --filter forge-docs run deploy
        env:
          # The site's origin, for canonicals, OG URLs and the sitemap. Set the
          # `FORGE_DOCS_SITE_URL` repository variable to the Worker's address
          # once it exists; without it they point at localhost.
          DOCS_SITE_URL: ${{ vars.FORGE_DOCS_SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FORGE_DOCS_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.FORGE_DOCS_CLOUDFLARE_API_TOKEN }}
