# Deploys the Forge docs site (`packages/docs`) from `main`, to the `forge-docs`
# Worker's workers.dev address until it has a domain.

name: Deploy Forge docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/deploy-forge-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-forge-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Forge docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-workspace

      # Canonicals, OG URLs and the sitemap are built from the site's origin,
      # so a deploy without it would point them at localhost.
      - name: Check the site URL is set
        if: vars.FORGE_DOCS_SITE_URL == ''
        run: |
          echo "::error::Set the FORGE_DOCS_SITE_URL repository variable to the site's origin, such as https://forge-docs.<subdomain>.workers.dev."
          exit 1

      # The `deploy` script builds and lints the site, then deploys the build.
      # `run` is needed because `pnpm deploy` is a built-in pnpm command.
      - name: Build and deploy
        run: pnpm --filter forge-docs run deploy
        env:
          # The site's origin, for canonicals, OG URLs and the sitemap.
          DOCS_SITE_URL: ${{ vars.FORGE_DOCS_SITE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.FORGE_DOCS_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.FORGE_DOCS_CLOUDFLARE_API_TOKEN }}
