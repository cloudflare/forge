name: Deploy docs

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      openapi_release:
        description: Forge OpenAPI release tag (defaults to the latest release).
        required: false
        type: string

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs
    if: >-
      github.event_name != 'release' ||
      (github.event.release.prerelease == false && contains(github.event.release.assets.*.name, 'openapi.forge.json'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}

      - uses: ./.github/actions/setup-workspace

      - name: Build
        run: pnpm --filter docs-site build
        env:
          FORGE_OPENAPI_RELEASE: ${{ github.event.release.tag_name || inputs.openapi_release || '' }}

      - name: Deploy
        run: pnpm --dir packages/docs-site exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
