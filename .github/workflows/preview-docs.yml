# Deploys each pull request's docs site as a Worker Preview of the `docs`
# Worker and comments the preview URL on the pull request. The preview is
# named after the branch, so new pushes update the same preview.
#
# Pull requests from forks are skipped: they get no repository secrets.
# CI's checks still build them.

name: Preview docs

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/astro-fern/**'
      - 'packages/fern-forge/**'
      - 'packages/cloudflare-api-site/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/preview-docs.yml'
      - '.github/actions/materialize-api-versions/**'

concurrency:
  group: preview-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview docs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # Preview URLs come from `previewUrls` in cloudflare.config.ts, which a
      # production deploy must apply first.
      - uses: ./.github/actions/materialize-api-versions
        id: specs

      - name: Deploy preview
        run: pnpm --filter cloudflare-api-site run deploy:preview | tee "$RUNNER_TEMP/preview.log"
        env:
          FORGE_OPENAPI_SPEC: ${{ steps.specs.outputs.rolling }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

