name: Rust

on:
  pull_request:
    branches: [main, feat/*]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - 'rust-toolchain.toml'
      - 'justfile'
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - '.github/workflows/rust.yml'
  push:
    branches: [main, feat/*]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - 'rust-toolchain.toml'
      - 'justfile'
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1

      # Installs the channel pinned in rust-toolchain.toml, and caches
      # ~/.cargo/registry and target/debug.
      - name: Install toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          components: rustfmt
          bins: just@1.58.0
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting
        run: just fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1

      # Installs the channel pinned in rust-toolchain.toml, and caches
      # ~/.cargo/registry and target/debug.
      - name: Install toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          components: clippy
          bins: just@1.58.0
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clippy
        run: just lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      # Installs the channel pinned in rust-toolchain.toml, and caches
      # ~/.cargo/registry and target/debug. tests/wasm.rs builds the guest in
      # tests/wasm/ts for wasm32-wasip2.
      - name: Install toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          targets: wasm32-wasip2
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: cargo test --locked --all-features
