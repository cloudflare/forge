# Publishes preview builds of @cloudflare/forge to pkg.pr.new. It makes no
# GitHub release and publishes nothing to npmjs.com. The package keeps the
# version in package.json; pkg.pr.new tells builds apart by commit.
#
#   push to main               .../@cloudflare/forge@main
#   pull request #<n> to main  .../@cloudflare/forge@<n>
#   workflow_dispatch          .../@cloudflare/forge@<branch>
#
# where ... is https://pkg.pr.new/cloudflare/forge. Each of those follows the
# newest build; every build can also be installed by commit, as
# .../@cloudflare/forge@<sha>. The URLs are long-form because
# @cloudflare/forge isn't on npmjs.com, which pkg.pr.new needs for its short
# ones.
#
# pkg.pr.new needs no token. Its GitHub App, which must be installed on the
# repository, checks that the upload comes from a run of this repository's
# workflows. That holds for pull requests from forks too, so the publish step
# skips them: they build and pack, but their code doesn't get a URL under
# this repository.
#
# A pull request builds GitHub's merge of its branch into main, but
# pkg.pr.new files the build under the branch's head commit, so <sha> is
# that. A new push to the pull request cancels its running build.
#
# The checkouts set no `ref:`, so every job builds the commit that started
# the run and saves its caches under that branch. CodeQL flags a checkout of
# any other commit as cache poisoning.

name: Publish preview

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'justfile'
      - 'src/**'
      - 'packages/forge/**'
      - '!packages/forge/test/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/publish-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'justfile'
      - 'src/**'
      - 'packages/forge/**'
      - '!packages/forge/test/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per platform, each on a runner that builds its target with plain
  # `cargo build`: macOS for both Mac targets, x64 and arm64 Linux runners with
  # musl-tools for the static Linux binaries, and Windows for both MSVC
  # targets. The list must match `platforms` in packages/forge/scripts/
  # platforms.mjs; scripts/archive.mjs refuses to pack a package that misses
  # a platform.
  #
  # Each job builds with `just build <target>`, the recipe local builds use,
  # and uploads target/binaries as forge-<platform>.
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
            exe: forge
            runs: true
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-latest
            exe: forge
            runs: false
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            exe: forge
            runs: true
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            exe: forge
            runs: true
          # `just build` links the C runtime into both Windows binaries.
          - platform: win32-arm64
            target: aarch64-pc-windows-msvc
            runner: windows-latest
            exe: forge.exe
            runs: false
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            exe: forge.exe
            runs: true
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the channel pinned in rust-toolchain.toml and the matrix
      # target, and caches ~/.cargo/registry and target/<target>/release,
      # where `cargo build --target` puts the build. cache-target is part of
      # the cache key, so every target gets a cache of its own.
      - name: Install toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          targets: ${{ matrix.target }}
          bins: just@1.58.0
          cache-target: ${{ matrix.target }}/release
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The C compiler for musl, which the cc crate uses for wasmtime's C code.
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # The same recipe builds locally; it puts the binary in
      # target/binaries/<target>/release/.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: just build "$TARGET"

      # A binary the runner can execute gets a quick run, which catches a
      # broken link before the package is published.
      - name: Smoke test
        if: matrix.runs
        env:
          BIN: target/binaries/${{ matrix.target }}/release/${{ matrix.exe }}
        run: '"$BIN" --version'

      # Uploading target/binaries keeps <target>/release/ inside the artifact.
      # Artifacts drop the executable bit, which scripts/archive.mjs sets
      # again when it packs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-${{ matrix.platform }}
          path: target/binaries
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Pack and publish to pkg.pr.new
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0

      # Merges the build jobs' artifacts into target/binaries/<target>/release/,
      # where `just pack` picks them up, as it does locally.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: forge-*
          merge-multiple: true
          path: target/binaries

      - name: Pack
        run: just pack

      - name: Publish
        id: publish
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          pnpm exec pkg-pr-new publish
          --no-compact
          --no-template
          'packages/forge/dist/cloudflare-forge-*.tgz'

      - name: Summary
        if: steps.publish.outcome == 'success'
        env:
          URL: ${{ steps.publish.outputs.urls }}
          REF: ${{ github.event.pull_request.number || github.ref_name }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### @cloudflare/forge

          Published to pkg.pr.new. Install this build:

          \`\`\`sh
          npm install $URL
          \`\`\`

          Or the newest build of $REF:

          \`\`\`sh
          npm install https://pkg.pr.new/$GITHUB_REPOSITORY/@cloudflare/forge@$REF
          \`\`\`
          EOF
