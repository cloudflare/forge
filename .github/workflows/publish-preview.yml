# Publishes preview builds of @cloudflare/forge to GitHub Packages. It makes
# no GitHub release, publishes nothing to npmjs.com, and never uses the
# `latest` dist-tag.
#
#   push to main                  0.1.0-main.<run>.g<sha>     dist-tag `main`
#   workflow_dispatch on main     0.1.0-main.<run>.g<sha>     dist-tag `main`
#   workflow_dispatch on <branch> 0.1.0-<slug>.<run>.g<sha>   dist-tag `branch-<slug>`
#   pull request #<n> to main     0.1.0-pr-<n>.<run>.g<sha>   dist-tag `pr-<n>`
#
# <slug> is the branch name in lowercase, with every run of characters other
# than letters, digits and hyphens turned into one hyphen, and hyphens
# trimmed from the ends. So feat/Foo_bar becomes feat-foo-bar. The `branch-`
# prefix keeps a branch from taking a dist-tag like `latest` or `main`, or
# one npm would read as a version range, such as `v2`.
#
# Only the publish job can write packages, and it runs none of the
# repository's code. It downloads the tarball the pack job made and
# publishes it. Pull requests from forks build and pack but don't publish:
# their GITHUB_TOKEN can't write packages.
#
# A pull request builds GitHub's merge of its branch into main, so <sha> is
# that merge commit. A new push to the pull request cancels its running build.
#
# The checkouts set no `ref:`, so every job builds the commit that started
# the run and saves its caches under that branch. CodeQL flags a checkout of
# any other commit as cache poisoning.

name: Publish preview

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'packages/forge/**'
      - '!packages/forge/test/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/publish-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'packages/forge/**'
      - '!packages/forge/test/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Resolve branch
        id: resolve
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            channel="pr-$PR_NUMBER"
            tag="pr-$PR_NUMBER"
          elif [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::error::builds branches and pull requests only, not $GITHUB_REF"
            exit 1
          elif [ "$GITHUB_REF_NAME" = main ]; then
            channel=main
            tag=main
          else
            channel=$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^0-9a-z-]+/-/g; s/^-+//; s/-+$//')
            if [ -z "$channel" ]; then
              echo "::error::cannot make a version out of the branch name $GITHUB_REF_NAME"
              exit 1
            fi
            tag="branch-$channel"
          fi
          {
            echo "sha=$GITHUB_SHA"
            echo "channel=$channel"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A prerelease of the version in Cargo.toml. The run number orders the
      # builds. The `g` stops a short SHA like 0123456 from being read as a
      # number with a leading zero, which semver forbids.
      #
      # Only the npm package gets this version. The binaries still report the
      # one in Cargo.toml, so `forge --version` prints 0.1.0.
      - name: Compute version
        id: version
        env:
          CHANNEL: ${{ steps.resolve.outputs.channel }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          base=$(node --input-type=module -e "import { cargoVersion } from './packages/forge/scripts/platforms.mjs'; console.log(cargoVersion());")
          version="$base-$CHANNEL.$GITHUB_RUN_NUMBER.g${SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building @cloudflare/forge@$version from $SHA"

  # One job per platform, each on a runner that builds its target with plain
  # `cargo build`: macOS for both Mac targets, x64 and arm64 Linux runners with
  # musl-tools for the static Linux binaries, and Windows for both MSVC
  # targets. The list must match `platforms` in packages/forge/scripts/
  # platforms.mjs; scripts/archive.mjs refuses to pack a package that misses
  # a platform.
  #
  # Each job uploads its binary as forge-<platform>. upload-artifact keeps the
  # path from the first wildcard on, so target/*/release/forge keeps
  # <target>/release/, where scripts/archive.mjs looks. A job builds only its
  # own target, so the wildcard matches one file.
  build:
    name: Build (${{ matrix.platform }})
    needs: meta
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
            exe: forge
            runs: true
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-latest
            exe: forge
            runs: false
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            exe: forge
            runs: true
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            exe: forge
            runs: true
          # Link the C runtime in, or the binary needs VCRUNTIME140.dll from
          # the Visual C++ Redistributable, which many machines don't have.
          - platform: win32-arm64
            target: aarch64-pc-windows-msvc
            runner: windows-latest
            exe: forge.exe
            rustflags: -C target-feature=+crt-static
            runs: false
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            exe: forge.exe
            rustflags: -C target-feature=+crt-static
            runs: true
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the channel pinned in rust-toolchain.toml and the matrix
      # target, and caches ~/.cargo/registry and target/<target>/release,
      # where `cargo build --target` puts the build. cache-target is part of
      # the cache key, so every target gets a cache of its own.
      - name: Install toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          targets: ${{ matrix.target }}
          cache-target: ${{ matrix.target }}/release
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The C compiler for musl, which the cc crate uses for wasmtime's C code.
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # `wasm` gives `--target wasm://`, which runs plugins.
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --features wasm --target "$TARGET"

      # A binary the runner can execute gets a quick run, which catches a
      # broken link before the package is published.
      - name: Smoke test
        if: matrix.runs
        env:
          BIN: target/${{ matrix.target }}/release/${{ matrix.exe }}
        run: '"$BIN" --version'

      # Artifacts drop the executable bit, which scripts/archive.mjs sets
      # again when it packs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-${{ matrix.platform }}
          path: target/*/release/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack
    needs: [meta, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # Merges the build jobs' artifacts into binaries/<target>/release/,
      # where scripts/archive.mjs picks them up.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: forge-*
          merge-multiple: true
          path: ${{ runner.temp }}/binaries

      - name: Pack
        working-directory: packages/forge
        env:
          BINARIES: ${{ runner.temp }}/binaries
          VERSION: ${{ needs.meta.outputs.version }}
        run: node scripts/archive.mjs --artifacts "$BINARIES" --version "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: packages/forge/dist/cloudflare-forge-${{ needs.meta.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to GitHub Packages
    needs: [meta, pack]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # Writes an .npmrc that sends @cloudflare to GitHub Packages, with
      # NODE_AUTH_TOKEN as the token.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          registry-url: https://npm.pkg.github.com
          scope: '@cloudflare'

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.meta.outputs.sha }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          pkg="@cloudflare/forge@$VERSION"

          # Only E404 means this version isn't published yet. Any other
          # failure, such as a bad token (E401), stops here with npm's error.
          if npm view "$pkg" version >"$RUNNER_TEMP/view.out" 2>"$RUNNER_TEMP/view.err"; then
            have=$(cat "$RUNNER_TEMP/view.out")
          elif grep -q 'code E404' "$RUNNER_TEMP/view.err"; then
            have=
          else
            cat "$RUNNER_TEMP/view.err" >&2
            exit 1
          fi
          if [ "$have" = "$VERSION" ]; then
            echo "$pkg is published already"
          else
            npm publish "./package/cloudflare-forge-$VERSION.tgz" --tag "$TAG"
          fi

          # The registry can take a moment to list a version it just took.
          for attempt in 1 2 3 4 5; do
            tarball=$(npm view "$pkg" dist.tarball 2>/dev/null) && [ -n "$tarball" ] && break
            [ "$attempt" = 5 ] && { echo "cannot read the tarball URL of $pkg" >&2; exit 1; }
            sleep 3
          done

          # Installing from the tarball URL leaves the @cloudflare scope on
          # npmjs.com. Mapping the scope to GitHub Packages would send every
          # @cloudflare/* package there, and the others would 404.
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### $pkg

          Published to GitHub Packages with the dist-tag \`$TAG\`, from $SHA.

          Add a token with \`read:packages\` to your .npmrc, and leave out any \`@cloudflare:registry\` line, which would send every @cloudflare/* package to GitHub Packages:

          \`\`\`ini
          //npm.pkg.github.com/:_authToken=\${GITHUB_TOKEN}
          \`\`\`

          Then install this build from its tarball:

          \`\`\`sh
          npm install $tarball
          \`\`\`

          To find the newest \`$TAG\` build later:

          \`\`\`sh
          npm view @cloudflare/forge@$TAG version dist.tarball --@cloudflare:registry=https://npm.pkg.github.com
          \`\`\`
          EOF
