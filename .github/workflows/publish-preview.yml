# Publishes preview builds of @cloudflare/forge to pkg.pr.new. It makes no
# GitHub release and publishes nothing to npmjs.com. The package keeps the
# version in package.json; pkg.pr.new tells builds apart by commit.
#
#   push to main               .../@cloudflare/forge@main
#   pull request #<n> to main  .../@cloudflare/forge@<n>
#   workflow_dispatch          .../@cloudflare/forge@<branch>
#
# where ... is https://pkg.pr.new/cloudflare/forge. Each of those follows the
# newest build; every build can also be installed by commit, as
# .../@cloudflare/forge@<sha>. The URLs are long-form because
# @cloudflare/forge isn't on npmjs.com, which pkg.pr.new needs for its short
# ones.
#
# pkg.pr.new needs no token. Its GitHub App, which must be installed on the
# repository, checks that the upload comes from a run of this repository's
# workflows. That holds for pull requests from forks too, so the publish step
# skips them: they build and pack, but their code doesn't get a URL under
# this repository.
#
# A pull request builds GitHub's merge of its branch into main, but
# pkg.pr.new files the build under the branch's head commit, so <sha> is
# that. A new push to the pull request cancels its running build.
#
# The checkouts set no `ref:`, so every job builds the commit that started
# the run and saves its caches under that branch. CodeQL flags a checkout of
# any other commit as cache poisoning.

name: Publish preview

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'packages/forge/**'
      - '!packages/forge/test/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/publish-preview.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'src/**'
      - 'packages/forge/**'
      - '!packages/forge/test/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/setup-workspace/**'
      - '.github/workflows/publish-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per platform, each on a runner that builds its target with plain
  # `cargo build`: macOS for both Mac targets, x64 and arm64 Linux runners with
  # musl-tools for the static Linux binaries, and Windows for both MSVC
  # targets. The list must match `platforms` in packages/forge/scripts/
  # platforms.mjs; scripts/archive.mjs refuses to pack a package that misses
  # a platform.
  #
  # Each job uploads its binary as forge-<platform>. upload-artifact keeps the
  # path from the first wildcard on, so target/*/release/forge keeps
  # <target>/release/, where scripts/archive.mjs looks. A job builds only its
  # own target, so the wildcard matches one file.
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            runner: macos-latest
            exe: forge
            runs: true
          - platform: darwin-x64
            target: x86_64-apple-darwin
            runner: macos-latest
            exe: forge
            runs: false
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            exe: forge
            runs: true
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            exe: forge
            runs: true
          # Link the C runtime in, or the binary needs VCRUNTIME140.dll from
          # the Visual C++ Redistributable, which many machines don't have.
          - platform: win32-arm64
            target: aarch64-pc-windows-msvc
            runner: windows-latest
            exe: forge.exe
            rustflags: -C target-feature=+crt-static
            runs: false
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            exe: forge.exe
            rustflags: -C target-feature=+crt-static
            runs: true
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the channel pinned in rust-toolchain.toml and the matrix
      # target, and caches ~/.cargo/registry and target/<target>/release,
      # where `cargo build --target` puts the build. cache-target is part of
      # the cache key, so every target gets a cache of its own.
      - name: Install toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          targets: ${{ matrix.target }}
          cache-target: ${{ matrix.target }}/release
          cache-base: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The C compiler for musl, which the cc crate uses for wasmtime's C code.
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # `wasm` gives `--target wasm://`, which runs plugins.
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --features wasm --target "$TARGET"

      # A binary the runner can execute gets a quick run, which catches a
      # broken link before the package is published.
      - name: Smoke test
        if: matrix.runs
        env:
          BIN: target/${{ matrix.target }}/release/${{ matrix.exe }}
        run: '"$BIN" --version'

      # Artifacts drop the executable bit, which scripts/archive.mjs sets
      # again when it packs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-${{ matrix.platform }}
          path: target/*/release/${{ matrix.exe }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Pack and publish to pkg.pr.new
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-workspace

      # Merges the build jobs' artifacts into binaries/<target>/release/,
      # where scripts/archive.mjs picks them up.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: forge-*
          merge-multiple: true
          path: ${{ runner.temp }}/binaries

      - name: Pack
        working-directory: packages/forge
        env:
          BINARIES: ${{ runner.temp }}/binaries
        run: node scripts/archive.mjs --artifacts "$BINARIES"

      - name: Publish
        id: publish
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: >-
          pnpm exec pkg-pr-new publish
          --no-compact
          --no-template
          'packages/forge/dist/cloudflare-forge-*.tgz'

      - name: Summary
        if: steps.publish.outcome == 'success'
        env:
          URL: ${{ steps.publish.outputs.urls }}
          REF: ${{ github.event.pull_request.number || github.ref_name }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### @cloudflare/forge

          Published to pkg.pr.new. Install this build:

          \`\`\`sh
          npm install $URL
          \`\`\`

          Or the newest build of $REF:

          \`\`\`sh
          npm install https://pkg.pr.new/$GITHUB_REPOSITORY/@cloudflare/forge@$REF
          \`\`\`
          EOF
