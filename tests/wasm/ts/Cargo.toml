# The TypeScript generator of the `forge` command, compiled to a forge wasm
# plugin. tests/wasm.rs builds it with:
#
#     cargo build --release --target wasm32-wasip2
#
# Its own workspace, so it builds apart from forge, for another target.
[workspace]

[package]
name = "forge-ts-wasm"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Makes `generate` return everything the API gives, from tests/wasm/dump.rs,
# rather than the SDK.
dump = []

[dependencies]
# Reads the JSON text the host sends for a `Json`, keeping objects in order.
serde_json = { version = "1", features = ["preserve_order"] }
wit-bindgen = "0.57"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
